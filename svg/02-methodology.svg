<text x="750" y="936" font-size="13" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">线上数据 → 评价 → 实验 → 发布 → 反馈 → 再评估</text>
<text x="750" y="960" font-size="12" fill="#98A2B3" font-family="PingFang SC, Microsoft YaHei, sans-serif">失败样本比成功截图更有资格进入下一轮</text>
<text x="720" y="1016" text-anchor="middle" font-size="13" fill="#667085" font-family="PingFang SC, Microsoft YaHei, sans-serif">架构先回答“价值如何被稳定交付”，再回答“用哪一个模型”。</text>
