<text x="750" y="800" font-size="14" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">系统流 2 · 模型与上下文工程</text>
<text x="750" y="826" font-size="13" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">选型 → 路由 → Prompt / RAG → 引用约束 → 成本与安全过滤</text>
<text x="750" y="850" font-size="12" fill="#98A2B3" font-family="PingFang SC, Microsoft YaHei, sans-serif">先把上下文装对，再谈模型是否够聪明</text>
