<text x="40" y="936" font-size="13" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">发布 → 监控 → 告警 → 回滚 → 容量与成本 → 人工接管</text>
<text x="40" y="960" font-size="12" fill="#98A2B3" font-family="PingFang SC, Microsoft YaHei, sans-serif">Agent 上线后按服务治理，不按演示脚本治理</text>
<rect x="730" y="882" width="690" height="96" rx="12" fill="#E7F8F4" stroke="#C7EDE4"/>
