<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 970" role="img">
  <title>AI 应用架构十大边界</title>
  <desc>用十大边界划清模型不该承担的责任，并与五层架构、三条系统流和一个进化闭环对齐。</desc>
  <rect width="100%" height="100%" fill="#F6F8FB"/>
<rect x="0" y="0" width="1440" height="78" fill="#12355B"/>
<text x="720" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif">AI 应用架构十大边界</text>
<text x="720" y="60" text-anchor="middle" font-size="13" fill="#D6E4F5" font-family="PingFang SC, Microsoft YaHei, sans-serif">让复杂的 AI 系统从“都能做”变成“可拆、可控、可验收”</text>
<rect x="16" y="96" width="210" height="620" rx="12" fill="#F8FAFC" stroke="#E4E7EC"/>
<text x="121" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">2 个横切维度</text>
<rect x="28" y="146" width="186" height="250" rx="10" fill="#E7F6EE"/>
<text x="121" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#067647" font-family="PingFang SC, Microsoft YaHei, sans-serif">安全与治理</text>
<rect x="28" y="408" width="186" height="288" rx="10" fill="#F4F0FF"/>
<text x="121" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#6927DA" font-family="PingFang SC, Microsoft YaHei, sans-serif">价值交付</text>
<text x="44" y="210" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">身份与权限</text>
<text x="44" y="238" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">隐私与内容</text>
<text x="44" y="266" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">模型与输出</text>
<text x="44" y="294" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">审计与接管</text>
<text x="44" y="322" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">不因“智能”而豁免</text>
<text x="44" y="478" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">用户是否完成任务</text>
<text x="44" y="514" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">业务是否更快</text>
<text x="44" y="550" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">成本是否可解释</text>
<text x="44" y="586" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">风险是否可接受</text>
<text x="44" y="622" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">演示成功 ≠ 交付成功</text>
<rect x="242" y="96" width="850" height="112" rx="12" fill="#F4F1FF"/>
<circle cx="274" cy="136" r="14" fill="#6D5EF5"/>
<text x="274" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif">5</text>
<text x="300" y="132" font-size="16" font-weight="700" fill="#3F2E9E" font-family="PingFang SC, Microsoft YaHei, sans-serif">评估与进化</text>
<text x="300" y="156" font-size="13" fill="#667085" font-family="PingFang SC, Microsoft YaHei, sans-serif">评测 · 实验 · 发布 · 反馈</text>
<text x="300" y="186" font-size="13" fill="#3F2E9E" font-family="PingFang SC, Microsoft YaHei, sans-serif">边界 3 评测边界、边界 8 运行边界在这里被验收</text>
<rect x="242" y="220" width="850" height="112" rx="12" fill="#EAF1FF"/>
<circle cx="274" cy="260" r="14" fill="#2F6FED"/>
<text x="274" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif">4</text>
<text x="300" y="256" font-size="16" font-weight="700" fill="#1849A9" font-family="PingFang SC, Microsoft YaHei, sans-serif">工程运行</text>
<text x="300" y="280" font-size="13" fill="#667085" font-family="PingFang SC, Microsoft YaHei, sans-serif">Runtime · 状态 · 编排 · 可观测</text>
<text x="300" y="310" font-size="13" fill="#1849A9" font-family="PingFang SC, Microsoft YaHei, sans-serif">边界 5 工具边界、边界 6 权限边界在这里执行</text>
<rect x="242" y="344" width="850" height="112" rx="12" fill="#E8F7EF"/>
<circle cx="274" cy="384" r="14" fill="#1F9D62"/>
<text x="274" y="389" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif">3</text>
<text x="300" y="380" font-size="16" font-weight="700" fill="#087443" font-family="PingFang SC, Microsoft YaHei, sans-serif">智能决策</text>
<text x="300" y="404" font-size="13" fill="#667085" font-family="PingFang SC, Microsoft YaHei, sans-serif">Workflow · Agent · 多智能体 · 人机协同</text>
<text x="300" y="434" font-size="13" fill="#087443" font-family="PingFang SC, Microsoft YaHei, sans-serif">边界 10 责任边界：谁拍板、谁兜底</text>
<rect x="242" y="468" width="850" height="112" rx="12" fill="#FFF6E8"/>
<circle cx="274" cy="508" r="14" fill="#E39B12"/>
<text x="274" y="513" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif">2</text>
<text x="300" y="504" font-size="16" font-weight="700" fill="#B54708" font-family="PingFang SC, Microsoft YaHei, sans-serif">知识与记忆</text>
<text x="300" y="528" font-size="13" fill="#667085" font-family="PingFang SC, Microsoft YaHei, sans-serif">知识工程 · RAG · Memory · 更新</text>
<text x="300" y="558" font-size="13" fill="#B54708" font-family="PingFang SC, Microsoft YaHei, sans-serif">边界 2 知识边界、边界 7 数据边界、边界 9 安全边界</text>
<rect x="242" y="592" width="850" height="112" rx="12" fill="#E7F6FB"/>
<circle cx="274" cy="632" r="14" fill="#2F9CC4"/>
<text x="274" y="637" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif">1</text>
<text x="300" y="628" font-size="16" font-weight="700" fill="#0E7090" font-family="PingFang SC, Microsoft YaHei, sans-serif">模型与上下文</text>
<text x="300" y="652" font-size="13" fill="#667085" font-family="PingFang SC, Microsoft YaHei, sans-serif">模型 · Context · Prompt · 路由治理</text>
<text x="300" y="682" font-size="13" fill="#0E7090" font-family="PingFang SC, Microsoft YaHei, sans-serif">边界 1 模型边界、边界 4 提示词边界从这里开始</text>
<rect x="1108" y="96" width="316" height="620" rx="12" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="1266" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">十大边界</text>
<text x="1124" y="158" font-size="13" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">1 模型边界</text>
<text x="1124" y="178" font-size="12" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">生成与建议，不替代制度、审批和最终责任。</text>
<text x="1124" y="212" font-size="13" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">2 知识边界</text>
<text x="1124" y="232" font-size="12" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">只回答授权知识库覆盖的范围，缺知识要明示。</text>
<text x="1124" y="266" font-size="13" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">3 评测边界</text>
<text x="1124" y="286" font-size="12" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">上线前有题集、阈值和人工抽检，不凭感觉发布。</text>
<text x="1124" y="320" font-size="13" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">4 提示词边界</text>
<text x="1124" y="340" font-size="12" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">系统提示是配置，变更走版本，不在线上随口改。</text>
<text x="1124" y="374" font-size="13" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">5 工具边界</text>
<text x="1124" y="394" font-size="12" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">每个工具有权限、幂等和失败语义，不能无限调用。</text>
<text x="1124" y="428" font-size="13" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">6 权限边界</text>
<text x="1124" y="448" font-size="12" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">检索、记忆、工具都继承用户权限，禁止越权拼上下文。</text>
<text x="1124" y="482" font-size="13" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">7 数据边界</text>
<text x="1124" y="502" font-size="12" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">训练、索引、日志、导出分开，敏感数据默认可不进模型。</text>
<text x="1124" y="536" font-size="13" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">8 运行边界</text>
<text x="1124" y="556" font-size="12" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">超时、重试、并发、成本有上限，失控必须能停。</text>
<text x="1124" y="590" font-size="13" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">9 安全边界</text>
<text x="1124" y="610" font-size="12" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">注入、越狱、有害输出、隐私泄露有检测和阻断。</text>
<text x="1124" y="644" font-size="13" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">10 责任边界</text>
<text x="1124" y="664" font-size="12" fill="#475467" font-family="PingFang SC, Microsoft YaHei, sans-serif">高影响动作必须人确认；系统记录谁批准、谁执行。</text>
<rect x="16" y="736" width="460" height="210" rx="12" fill="#FFFFFF" stroke="#E4E7EC"/>
<text x="36" y="768" font-size="15" font-weight="700" fill="#12355B" font-family="PingFang SC, Microsoft YaHei, sans-serif">3 条系统流</text>
<text x="36" y="804" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">数据流：采集 → 治理 → 索引 → 权限过滤 → 引用</text>
<text x="36" y="832" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">控制流：目标 → 规划 / 流程 → 工具 → 状态 → 停止</text>
<text x="36" y="860" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">价值流：用户任务 → 完成质量 → 成本 → 业务结果</text>
<text x="36" y="900" font-size="12" fill="#98A2B3" font-family="PingFang SC, Microsoft YaHei, sans-serif">三条流同时健康，架构才算闭合。</text>
<rect x="492" y="736" width="460" height="210" rx="12" fill="#E7F8F4"/>
<text x="512" y="768" font-size="15" font-weight="700" fill="#0E7090" font-family="PingFang SC, Microsoft YaHei, sans-serif">1 个进化闭环</text>
<text x="512" y="808" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">线上轨迹 → 失败样本 → 评测补题</text>
<text x="512" y="836" font-size="13" fill="#344054" font-family="PingFang SC, Microsoft YaHei, sans-serif">→ 实验对照 → 灰度发布 → 反馈再进入评测</text>
<text x="512" y="876" font-size="12" fill="#667085" font-family="PingFang SC, Microsoft YaHei, sans-serif">闭环的输入是证据，不是新想法的数量。</text>
<text x="512" y="900" font-size="12" fill="#667085" font-family="PingFang SC, Microsoft YaHei, sans-serif">每一次越界事故，都应变成一条新的边界检查。</text>
<rect x="968" y="736" width="456" height="210" rx="12" fill="#12355B"/>
<text x="988" y="768" font-size="15" font-weight="700" fill="#FFFFFF" font-family="PingFang SC, Microsoft YaHei, sans-serif">汇报时怎么用这十句话</text>
<text x="988" y="808" font-size="13" fill="#E4E7EC" font-family="PingFang SC, Microsoft YaHei, sans-serif">先问：这件事越过了哪一条边界？</text>
<text x="988" y="836" font-size="13" fill="#E4E7EC" font-family="PingFang SC, Microsoft YaHei, sans-serif">再问：边界落在五层中的哪一层执行？</text>
<text x="988" y="864" font-size="13" fill="#E4E7EC" font-family="PingFang SC, Microsoft YaHei, sans-serif">最后问：谁验收、谁能停止、谁负责任？</text>
<text x="988" y="904" font-size="12" fill="#9FB4CC" font-family="PingFang SC, Microsoft YaHei, sans-serif">答不上来的能力，不进入本季度交付范围。</text>
</svg>
